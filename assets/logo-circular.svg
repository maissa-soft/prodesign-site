<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <!-- Circular borders -->
  <circle cx="150" cy="150" r="142" fill="none" stroke="#0f223f" stroke-width="4" />
  <circle cx="150" cy="150" r="134" fill="none" stroke="#cca43b" stroke-width="2" />

  <!-- Symbol centered and shifted up -->
  <g transform="translate(90, 35)">
    <path d="M42,90 C42,90 37,68 37,52 C37,32 50,20 68,20 C86,20 97,32 97,52 C97,72 86,84 68,84 C58,84 50,78 46,70 L54,62 C57,66 62,70 68,70 C78,70 84,62 84,52 C84,42 78,34 68,34 C58,34 50,42 50,52 L50,90 Z" fill="#0f223f" />
    <polygon points="42,90 58,90 50,74" fill="#cca43b" />
  </g>

  <!-- Typography -->
  <text x="150" y="180" font-family="'Outfit', 'Poppins', 'Segoe UI', sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#0f223f">
    Pro<tspan fill="#cca43b">Design</tspan>
  </text>
  
  <text x="150" y="200" font-family="'Outfit', 'Poppins', 'Segoe UI', sans-serif" font-size="10.5" font-weight="500" letter-spacing="4" text-anchor="middle" fill="#0f223f">
    CRÉATIONS DIGITALES
  </text>

  <!-- Service Icons Row -->
  <g fill="#0f223f" transform="translate(0, 5)">
    <!-- Icon 1: Presentation Screen -->
    <g transform="translate(75, 215)">
      <rect x="1" y="2" width="18" height="12" rx="1" fill="none" stroke="#0f223f" stroke-width="2"/>
      <line x1="10" y1="14" x2="10" y2="18" stroke="#0f223f" stroke-width="2"/>
      <line x1="6" y1="18" x2="14" y2="18" stroke="#0f223f" stroke-width="2"/>
      <line x1="4" y1="8" x2="8" y2="5" stroke="#0f223f" stroke-width="1.5"/>
      <line x1="8" y1="5" x2="12" y2="10" stroke="#0f223f" stroke-width="1.5"/>
      <line x1="12" y1="10" x2="16" y2="6" stroke="#0f223f" stroke-width="1.5"/>
    </g>

    <!-- Icon 2: Document / Report -->
    <g transform="translate(110, 215)">
      <path d="M3,2 L13,2 L17,6 L17,18 C17,19 16,20 15,20 L3,20 C2,20 1,19 1,18 L1,4 C1,3 2,2 3,2 Z" fill="none" stroke="#0f223f" stroke-width="2"/>
      <path d="M12,2 L12,7 L17,7" fill="none" stroke="#0f223f" stroke-width="2"/>
      <line x1="4" y1="11" x2="14" y2="11" stroke="#0f223f" stroke-width="1.5"/>
      <line x1="4" y1="14" x2="14" y2="14" stroke="#0f223f" stroke-width="1.5"/>
      <line x1="4" y1="17" x2="10" y2="17" stroke="#0f223f" stroke-width="1.5"/>
    </g>

    <!-- Icon 3: Business Card -->
    <g transform="translate(141, 216)">
      <rect x="0" y="1" width="18" height="13" rx="2" fill="none" stroke="#0f223f" stroke-width="1.8"/>
      <circle cx="5" cy="7" r="2.5" fill="none" stroke="#0f223f" stroke-width="1.5"/>
      <line x1="10" y1="6" x2="15" y2="6" stroke="#0f223f" stroke-width="1.5"/>
      <line x1="10" y1="9" x2="14" y2="9" stroke="#0f223f" stroke-width="1.5"/>
      <line x1="3" y1="11" x2="7" y2="11" stroke="#0f223f" stroke-width="1.5"/>
    </g>

    <!-- Icon 4: Notebook -->
    <g transform="translate(174, 215)">
      <rect x="3" y="1" width="14" height="18" rx="1.5" fill="none" stroke="#0f223f" stroke-width="2"/>
      <!-- Spiral rings -->
      <path d="M1,4 C1,4 3,4 3,4" stroke="#0f223f" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M1,8 C1,8 3,8 3,8" stroke="#0f223f" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M1,12 C1,12 3,12 3,12" stroke="#0f223f" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M1,16 C1,16 3,16 3,16" stroke="#0f223f" stroke-width="1.8" stroke-linecap="round"/>
      <!-- Elastic band -->
      <line x1="13" y1="1" x2="13" y2="19" stroke="#0f223f" stroke-width="1.5"/>
    </g>

    <!-- Icon 5: Globe -->
    <g transform="translate(207, 215)">
      <circle cx="9" cy="9" r="8" fill="none" stroke="#0f223f" stroke-width="2"/>
      <ellipse cx="9" cy="9" rx="8" ry="3" fill="none" stroke="#0f223f" stroke-width="1.5"/>
      <ellipse cx="9" cy="9" rx="3" ry="8" fill="none" stroke="#0f223f" stroke-width="1.5"/>
      <line x1="9" y1="1" x2="9" y2="17" stroke="#0f223f" stroke-width="1.5"/>
      <line x1="1" y1="9" x2="17" y2="9" stroke="#0f223f" stroke-width="1.5"/>
    </g>
  </g>
</svg>
